<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- `--ground` in either world, copied because a meta tag cannot read a
         custom property. The browser paints the chrome with it before the sheet
         is fetched, so a stale value here shows as a flash of the old palette. -->
    <meta name="theme-color" content="#eef0f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#212529" media="(prefers-color-scheme: dark)" />
    <!-- The masthead mark. PNG first, SVG second: at equal support the last
         declaration wins, so browsers that read SVG prefer it — crisp at every
         density, and it follows the tab's theme. Safari ignores the SVG type and
         falls back to the PNG, frozen on the mark's light variant. -->
    <link rel="icon" href="./favicon.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>ClipSweep</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

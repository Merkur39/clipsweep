    <!-- La marque du bandeau. Le PNG d'abord, le SVG ensuite : à support égal
         c'est la dernière déclaration qui l'emporte, donc les navigateurs qui
         lisent le SVG le préfèrent — net à toute densité, et il suit le thème
         de l'onglet. Safari ignore le type SVG et retombe sur le PNG, figé sur
         la variante claire de la marque. -->
    <link rel="icon" href="./favicon.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>GetClipTwitch</title>
  </head>
  <body>
    <!--
      THESIS: This tool records a sweep across time and declares where the trace
      was lost. It refuses the stack of identical rounded cards on Twitch's own
      greys that every clip tool ships.
      OWN-WORLD: A recording station's chassis — cool blue-graphite panels joined
      by hairline seams, near-zero radius, silkscreened small-caps labels ruled to
      the panel edge. Three inks, one meaning each: violet the normal trace, amber
      hatched a recut window, red a real gap. Data in mono, tabular, right-aligned.
      STORY: The visitor names a channel, watches the recorder draw, reads the
      table, and leaves with an export — knowing exactly what is missing.
      FIRST VIEWPORT: Nameplate strip, control head down the left seam, status line
      and results table filling the stage. Primary action follows what is left to do.
      FORM: Chart recorder; candidate 4 of the grounded list; seed c4de0987.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the
      finish review, the verdict, and DESIGN.md
    -->

    <script type="module" src="/src/main.tsx"></script>
  </body>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 24">
  <!--
    The mark from `Icon.tsx` (`Mark`), made self-standing.

    A favicon is loaded as an isolated document: the CSS variables of the parent
    document do not reach it, and `light-dark()` has no `color-scheme` to read
    there. The values from `base.css` are therefore carried over here by hand,
    and the switch is made by media query. That is the price of standing alone.

    Careful when editing this block: two consecutive hyphens close an XML
    comment. Spelling a CSS variable out in full here makes the file unreadable
    to the parser, and the favicon vanishes without anything signalling it (the
    file still serves with a 200).

    One deliberate divergence from the mark, and only one: the tail is a short
    bar here where the interface draws four dashes. At the size of a tab the
    gaps between those dashes fall under half a pixel, and four of them read as
    a smear. The bar says the same thing at a size that can hold it.

    `scripts/geometry/mark.test.ts` holds the three bars of this file to the
    ones in `Icon.tsx` and in `make-favicon.ts`.
  -->
  <style>
    .run { fill: #00957d }
    .tail { fill: #65686f }

    @media (prefers-color-scheme: dark) {
      .run { fill: #47d7b8 }
      .tail { fill: #858e9c }
    }
  </style>

  <rect class="run" x="2.5" y="3.4" width="23" height="2.9" rx="1.45" />
  <rect class="run" x="2.5" y="9.2" width="17" height="2.9" rx="1.45" opacity="0.72" />
  <rect class="run" x="2.5" y="15" width="10.5" height="2.9" rx="1.45" opacity="0.46" />
  <rect class="tail" x="2.5" y="20.5" width="5" height="2.9" rx="1.45" />
</svg>

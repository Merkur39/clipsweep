<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!--
    The mark from `Icon.tsx` (`Mark`), made self-standing.

    A favicon is loaded as an isolated document: the CSS variables of the parent
    document do not reach it, and `light-dark()` has no `color-scheme` to read
    there. The values from `base.css` are therefore carried over here by hand.
    That is the price of standing alone.

    Careful when editing this block: two consecutive hyphens close an XML
    comment. Spelling a CSS variable out in full here makes the file unreadable
    to the parser, and the favicon vanishes without anything signalling it (the
    file still serves with a 200).

    No media query any more, and that is not an omission: the plate carries the
    accent flat, which is the one colour of the system that is identical in both
    worlds, and the bars carry the white it was chosen to hold. Nothing here has
    a second value to switch to.

    The pattern is the mechanism: three windows of a sweep, growing.
  -->
  <rect fill="#0b5ed7" width="16" height="16" rx="5" />
  <rect fill="#ffffff" x="4" y="10" width="2" height="3" rx="1" />
  <rect fill="#ffffff" x="7" y="7" width="2" height="6" rx="1" />
  <rect fill="#ffffff" x="10" y="4.5" width="2" height="8.5" rx="1" />
</svg>

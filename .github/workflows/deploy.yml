name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule mise en ligne à la fois, sans interrompre celle qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # GitHub substitue une chaîne vide à une variable absente sans échouer :
      # sans ce garde-fou, un déploiement mal configuré part en ligne et n'est
      # découvert qu'en lisant l'encart rouge de l'application.
      - name: Vérifie que l'application Twitch est configurée
        env:
          CLIENT_ID: ${{ vars.VITE_TWITCH_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::La variable de dépôt VITE_TWITCH_CLIENT_ID est vide ou absente."
            echo "::error::Settings → Secrets and variables → Actions → Variables → Repository variables."
            echo "::error::Une variable d'environnement (github-pages) ne suffit pas : ce job ne déclare aucun environment."
            exit 1
          fi

      # `npm run build` enchaîne `tsc -b` puis `vite build`.
      # Variable de dépôt et non secret : un Client ID n'est pas confidentiel, et
      # un secret serait de toute façon masqué dans un bundle servi en clair.
      - run: npm run build
        env:
          VITE_TWITCH_CLIENT_ID: ${{ vars.VITE_TWITCH_CLIENT_ID }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

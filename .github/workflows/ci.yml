name: Checks

# Going live moved to Vercel, which builds and deploys on push. This workflow
# no longer deploys anything: it keeps only the checks, which had no reason to
# leave along with the deployment.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      # `npm run build` chains `tsc -b` then `vite build`: running it here
      # checks that the project compiles. The bundle it produces is not the one
      # that goes live — Vercel builds that one, with the
      # `VITE_TWITCH_CLIENT_ID` variable of its own project.
      - run: npm run build

# Keeps the npm dependencies and the CI actions up to date.
# Options: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Let a release sit in the wild before pulling it in: it keeps the churn of
    # same-week re-releases out, and a compromised package out of the lockfile.
    cooldown:
      default-days: 7
      semver-major-days: 14
    # @types/node describes a runtime rather than a library: it follows the Node
    # major the project runs on, which .nvmrc pins, not the newest one published.
    # A major ahead of that types calls the runtime does not have, and typecheck
    # would then pass on code that throws. Raise it by hand, with .nvmrc.
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # TypeScript 7 is the Go port, and typescript-eslint refuses to load
      # against it — `npm ci` already fails on its peer range (<6.1.0), and
      # forcing the install past that only reaches a hard throw inside the
      # plugin. Typecheck, build and tests all pass on 7.0.2: the lint alone
      # stands in the way. Upstream tracks support for TS >=7.1, so 7.0 will
      # never be it. Lift this once that ships:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
    groups:
      # Minor and patch only, so the group stays mergeable without being read.
      # A major matches no group and therefore gets a pull request of its own —
      # never a seat in this one.
      npm-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 7
    groups:
      # Same split, same reason: a major action bump is read, the rest is not.
      actions-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
